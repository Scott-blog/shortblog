{{- /* 文章末尾点赞按钮（中英双语） */ -}}
{{ if and (.IsPage) (ne .Layout "archives") }}
{{- $likeLabel := cond (eq .Lang "en") "Like" "喜欢" -}}
{{- $likeAria := cond (eq .Lang "en") "Like this post" "点赞" -}}
<div class="like-wrapper" id="like-wrapper">
  <button id="like-btn" class="like-btn" type="button" aria-label="{{ $likeAria }}">
    <svg class="like-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    </svg>
    <span>{{ $likeLabel }}</span>
    <span class="like-count">·</span>
  </button>
</div>
{{ end }}
