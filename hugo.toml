baseURL = "https://scottblog.cc"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "里呦锅的短评集"
theme = "PaperMod"
paginate = 10

enableRobotsTXT = true
buildDrafts = false

[params]
  author = "里呦锅"
  description = "北大法律人，政治经济、资本市场、哲学、AI"
  defaultTheme = "dark"          # 摄影师站风格：默认暗色，读者仍可手动切换
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = false

[params.homeInfoParams]
  Title = "短评集"
  Content = "关于法律、商业与人的流变"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Scott-blog"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true   # 单个回车 = 换行，不用再敲两个空格

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "短评"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 2

[minify]
  disableXML = true
