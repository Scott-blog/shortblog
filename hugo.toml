baseURL = "https://scottblog.cc"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false   # 中文在根路径，英文在 /en/
theme = "PaperMod"
paginate = 10

enableRobotsTXT = true
buildDrafts = false

[params]
  author = "里呦锅"
  defaultTheme = "dark"          # 摄影师站风格：默认暗色，读者仍可手动切换
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = false

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Scott-blog"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      hardWraps = true   # 单个回车 = 换行，不用再敲两个空格

[minify]
  disableXML = true

# ---------------- 双语配置：zh 在根路径，en 在 /en/ ----------------
[languages]
  [languages.zh]
    languageCode = "zh-cn"
    languageName = "中文"
    weight = 1
    title = "里呦锅的短评集"
    [languages.zh.params]
      description = "北大法律人，政治经济、资本市场、哲学、AI"
      [languages.zh.params.homeInfoParams]
        Title = "短评集"
        Content = "关于法律、商业与人的流变"
    [[languages.zh.menus.main]]
      identifier = "posts"
      name = "短评"
      url = "/posts/"
      weight = 1
    [[languages.zh.menus.main]]
      identifier = "about"
      name = "关于"
      url = "/about/"
      weight = 2

  [languages.en]
    languageCode = "en-us"
    languageName = "EN"
    weight = 2
    title = "Scott's Notes"
    [languages.en.params]
      author = "Scott"
      description = "Law, political economy, capital markets, philosophy, AI"
      [languages.en.params.homeInfoParams]
        Title = "Notes"
        Content = "On the flux of law, business, and people"
    [[languages.en.menus.main]]
      identifier = "posts"
      name = "Notes"
      url = "/en/posts/"
      weight = 1
    [[languages.en.menus.main]]
      identifier = "about"
      name = "About"
      url = "/en/about/"
      weight = 2
